<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #20252b;
      background: #f3f5f7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      background: #fff;
      border: 1px solid #e1e5e9;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgb(25 35 45 / 7%);
    }

    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: #5c6670; line-height: 1.5; }

    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 2px solid #2c6bed; outline-offset: 1px; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #245fd3;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #194eaf; }

    #result { min-height: 1.5em; margin: 20px 0 0; font-weight: 600; }
    #result.error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Simple Calculator</h1>
    <p>Enter two numbers and select Compute to add them.</p>

    <form id="calculator-form">
      <label for="number-one">First number</label>
      <input id="number-one" name="numberOne" type="number" step="any" required>

      <label for="number-two">Second number</label>
      <input id="number-two" name="numberTwo" type="number" step="any" required>

      <button type="submit">Compute</button>
    </form>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    // Calculation seam: replace this function to change the operation.
    function calculate(firstNumber, secondNumber) {
      return firstNumber + secondNumber;
    }

    const form = document.querySelector("#calculator-form");
    const result = document.querySelector("#result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const firstNumber = Number(form.elements.numberOne.value);
      const secondNumber = Number(form.elements.numberTwo.value);
      const answer = calculate(firstNumber, secondNumber);

      result.classList.remove("error");
      result.textContent = `Result: ${answer}`;
    });
  </script>
</body>
</html>
